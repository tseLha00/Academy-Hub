spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: academy-hub-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  paths-to-match: /api/**
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    persist-authorization: false
    # Use the masked token returned by /api/auth/csrf via Authorize.
    # Do not replace it with the raw XSRF-TOKEN cookie value.
    csrf:
      enabled: false
